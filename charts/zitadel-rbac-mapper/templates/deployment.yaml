apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zitadel-rbac-mapper.fullname" . }}
  labels:
    {{- include "zitadel-rbac-mapper.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "zitadel-rbac-mapper.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zitadel-rbac-mapper.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "zitadel-rbac-mapper.fullname" .) }}
      containers:
        - name: zitadel-rbac-mapper
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.env.PORT | default 8080 }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.healthPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.syncAPIKey }}
            - name: SYNC_API_KEY
              value: {{ .Values.syncAPIKey | quote }}
            {{- end }}
            {{- if .Values.zitadelKey.secretName }}
            - name: ZITADEL_KEY_FILE
              value: {{ .Values.zitadelKey.mountPath | quote }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.orgsConfig }}
            - name: config
              mountPath: /etc/config
              readOnly: true
            {{- end }}
            {{- if .Values.zitadelKey.secretName }}
            - name: zitadel-key
              mountPath: {{ dir .Values.zitadelKey.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.orgsConfig }}
        - name: config
          configMap:
            name: {{ include "zitadel-rbac-mapper.fullname" . }}-config
        {{- end }}
        {{- if .Values.zitadelKey.secretName }}
        - name: zitadel-key
          secret:
            secretName: {{ .Values.zitadelKey.secretName }}
            items:
              - key: {{ .Values.zitadelKey.secretKey }}
                path: {{ base .Values.zitadelKey.mountPath }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
