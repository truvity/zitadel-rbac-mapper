{{- if .Values.rbac.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "zitadel-rbac-mapper.fullname" . }}
  labels:
    {{- include "zitadel-rbac-mapper.labels" . | nindent 4 }}
rules:
  {{- toYaml .Values.rbac.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "zitadel-rbac-mapper.fullname" . }}
  labels:
    {{- include "zitadel-rbac-mapper.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name | default (include "zitadel-rbac-mapper.fullname" .) }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "zitadel-rbac-mapper.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
