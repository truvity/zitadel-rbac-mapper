replicaCount: 1

image:
  repository: ghcr.io/truvity/zitadel-rbac-mapper
  tag: ""  # defaults to appVersion
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8080

healthPort: 7070

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

# Environment variables for the mapper.
env:
  GROUPS_RESOLVER_URL: ""
  ZITADEL_DOMAIN: ""
  ZITADEL_PORT: "443"
  RULES_FILE: "/etc/config/rules.yaml"
  PORT: "8080"
  HEALTH_PORT: "7070"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"

# Secret environment variables (from existing K8s Secret).
envFrom: []
# - secretRef:
#     name: zitadel-rbac-mapper-secrets

# Mount the Zitadel JWT key from a K8s Secret.
zitadelKey:
  # Name of the K8s Secret containing the JWT key JSON.
  secretName: ""
  # Key in the Secret that holds the JSON content.
  secretKey: "key.json"
  # Mount path inside the container.
  mountPath: "/etc/secrets/zitadel-key.json"

# Mapping rules (YAML content, mounted as ConfigMap).
rules: []
# - group: platform-admins@example.com
#   grants:
#     - project: "376393789184419014"
#       roles: [admin]

# Sync API key (used by CronJob and external schedulers).
syncAPIKey: ""

# CronJob for full grant reconciliation.
cronJob:
  enabled: true
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

# google-group-sync Service URL (K8s mode — calls the separate Deployment).
groupSync:
  serviceURL: ""
  # e.g., http://google-group-sync.zitadel-rbac-mapper.svc:8080

# Optional HTTPRoute (Envoy Gateway) — default off.
# The webhook is the one external surface (called by Zitadel Actions).
httpRoute:
  enabled: false
  parentRefs: []
  hostnames: []
  rules: []

# Optional CiliumNetworkPolicy — default off.
# When enabled, restricts ingress to the webhook from Envoy Gateway only.
ciliumNetworkPolicy:
  enabled: false
  # Ingress allowed from these endpoints (e.g., Envoy Gateway pods).
  ingressFrom: []
  # - matchLabels:
  #     app.kubernetes.io/name: envoy-gateway

# Optional RBAC (Role/RoleBinding) — default off.
rbac:
  enabled: false
  rules: []

nodeSelector: {}
tolerations: []
affinity: {}
