replicaCount: 1

# PodDisruptionBudget — enabled automatically when replicaCount >= 2.
# The webhook sits on the login-enrichment path: with a single replica,
# every node consolidation is a brief enrichment brown-out. Run 2.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

image:
  repository: ghcr.io/truvity/zitadel-rbac-mapper/mapper
  tag: ""  # defaults to appVersion
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8080

healthPort: 7070

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

# Environment variables for the mapper.
# Per-org settings (resolver URLs, rules, bulkhead/circuit breaker) live in
# the v2 config file (see orgsConfig below), not in the environment.
env:
  ZITADEL_DOMAIN: ""
  ZITADEL_PORT: "443"
  CONFIG_FILE: "/etc/config/config.yaml"
  PORT: "8080"
  HEALTH_PORT: "7070"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"

# Secret environment variables (from existing K8s Secret).
envFrom: []
# - secretRef:
#     name: zitadel-rbac-mapper-secrets

# Mount the Zitadel JWT key from a K8s Secret.
zitadelKey:
  # Name of the K8s Secret containing the JWT key JSON.
  secretName: ""
  # Key in the Secret that holds the JSON content.
  secretKey: "key.json"
  # Mount path inside the container.
  mountPath: "/etc/secrets/zitadel-key.json"

# v2 org-aware config (mounted as ConfigMap at /etc/config/config.yaml).
# The raw document is rendered verbatim — see config.example.yaml in the repo.
#
#   orgsConfig:
#     roleCacheTTL: 5m
#     orgs:
#       "376393772658861254":
#         name: "Truvity B.V."
#         resolver:
#           url: "http://google-group-sync.zitadel-rbac-mapper.svc:8080"
#         rules:
#           - group: platform-admins@example.com
#             grants:
#               - project: "376393789184419014"
#                 roles: ["cluster:admin"]
#                 rolePatterns: ["dmsplus:*"]
orgsConfig: {}

# Sync API key (used by CronJob and external schedulers).
# When empty (default), the SYNC_API_KEY env var is not rendered — deliver the
# key via envFrom instead (e.g. an ESO-managed Secret sourced from SSM).
# Setting a value here renders SYNC_API_KEY as a plain env value; prefer the
# Secret path for anything beyond local experiments.
syncAPIKey: ""

# CronJob for full grant reconciliation.
cronJob:
  enabled: true
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

# Optional HTTPRoute (Envoy Gateway) — default off.
# The webhook is the one external surface (called by Zitadel Actions): the
# default rule matches path /webhook only, keeping /sync (Bearer-authed admin
# surface) and /health cluster-internal. Override `rules` to change routing.
httpRoute:
  enabled: false
  parentRefs: []
  hostnames: []
  rules: []

# Optional CiliumNetworkPolicy — default off.
# When enabled, restricts ingress to the webhook from Envoy Gateway only.
ciliumNetworkPolicy:
  enabled: false
  # Ingress allowed from these endpoints (e.g., Envoy Gateway pods).
  ingressFrom: []
  # - matchLabels:
  #     app.kubernetes.io/name: envoy-gateway

# Optional RBAC (Role/RoleBinding) — default off.
rbac:
  enabled: false
  rules: []

nodeSelector: {}
tolerations: []
affinity: {}

# Container hardening. The image is distroless static:nonroot, so
# enforcing this at the pod level costs nothing and pins the contract.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
